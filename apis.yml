aid: attentiveai
name: Attentive.ai
description: >-
  Attentive.ai builds AI-powered software for the construction and outdoor
  services industries, automating property measurements, takeoffs, and
  estimating from aerial imagery and blueprints. Its Automeasure platform
  measures properties from satellite and site-plan imagery for landscaping,
  paving, and snow-removal contractors, while Beam AI (ibeam.ai) automates
  construction takeoffs and estimates and BIM CoPilot handles modeling, clash
  detection, and as-built documentation. The company is backed by Insight
  Partners. This API Evangelist profile was enriched from the company's public
  web surface; Attentive.ai does not currently publish a public developer API,
  developer portal, or OpenAPI definition, so this record captures its identity,
  security posture, and site link properties rather than API artifacts.
